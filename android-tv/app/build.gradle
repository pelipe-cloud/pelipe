plugins {
    id 'com.android.application'
}

// Firma fija: si existe pelipe.jks (lo crea el workflow desde el secreto KEYSTORE_B64) y la contraseña
// llega por la variable KS_PASS (secreto KEYSTORE_PASS), todas las compilaciones se firman con la MISMA
// llave. Así la app se actualiza encima sin desinstalar y el código de acceso sigue ligado al dispositivo.
// La contraseña NUNCA va escrita en el código.
def ks = file('../pelipe.jks')
def ksPass = System.getenv('KS_PASS')
def firmaFija = ks.exists() && ksPass

android {
    namespace 'online.pelipe.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'online.pelipe.tv'
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName '2.10'
    }

    signingConfigs {
        pelipe {
            if (firmaFija) {
                storeFile ks
                storePassword ksPass
                keyAlias 'pelipe'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        debug {
            if (firmaFija) {
                signingConfig signingConfigs.pelipe
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
