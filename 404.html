<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pelipe.pm — Página no encontrada</title>
<script>
  // Enlaces compartidos a /p/ID/ de una película aún sin página generada: abrir el reproductor directamente.
  (function () {
    var m = location.pathname.match(/^(.*\/)p\/([^\/]+)\/?$/);
    if (m) location.replace(m[1] + '#/ver/' + m[2]);
  })();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b10;color:#f2f2f7;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}a{color:#fff;background:#ff5a36;padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:600;display:inline-block;margin-top:14px}</style>
</head>
<body>
<div>
  <h1>Esta página no existe</h1>
  <p>Puede que la película haya sido retirada o el enlace esté mal escrito.</p>
  <a href="/" onclick="this.href=location.pathname.split('/').slice(0,2).join('/')+'/'">Ir al inicio</a>
</div>
</body>
</html>
