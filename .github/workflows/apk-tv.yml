name: Crear APK para TV

on:
  workflow_dispatch:          # se lanza a mano: pestaña Actions → "Crear APK para TV" → Run workflow
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/apk-tv.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Firma fija (opcional): si creaste el secreto KEYSTORE_B64, todas las versiones llevan la misma firma
      - name: Firma fija
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android-tv/pelipe.jks
            echo "Firma fija activada"
          else
            echo "Sin secreto KEYSTORE_B64: se usa la firma de depuración (cambia en cada compilación)"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: pelipe-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
