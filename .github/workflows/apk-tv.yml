name: Crear APK para TV

on:
  workflow_dispatch:          # se lanza a mano: pestaña Actions → "Crear APK para TV" → Run workflow
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/apk-tv.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Firma fija (opcional): con los secretos KEYSTORE_B64 y KEYSTORE_PASS, todas las versiones llevan la misma firma
      - name: Firma fija
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > android-tv/pelipe.jks
            echo "Firma fija activada"
          else
            echo "Faltan los secretos KEYSTORE_B64 y/o KEYSTORE_PASS: se usa la firma de depuración (cambia en cada compilación)"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        working-directory: android-tv
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # Prepara los dos archivos que se suben a R2: pelipeapp.apk y version.json (la app lo lee para avisar de actualizaciones)
      - name: Preparar archivos para R2
        run: |
          VC=$(grep -oP "versionCode \K[0-9]+" android-tv/app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" android-tv/app/build.gradle)
          mkdir -p subir
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk subir/pelipeapp.apk
          printf '{"versionCode":%s,"versionName":"%s","url":"https://media.pelipe.online/pelipeapp.apk","notas":"Versión %s"}\n' "$VC" "$VN" "$VN" > subir/version.json
          cat subir/version.json

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: pelipe-tv-apk
          path: |
            subir/pelipeapp.apk
            subir/version.json
          if-no-files-found: error
