name: Verificar videos

on:
  schedule:
    - cron: '0 13 * * *'   # todos los días a las 8:00 a. m. hora de Colombia
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar videos del catálogo
        run: node verificar-videos.mjs https://pelipe.online/catalogo.json
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-videos
          path: videos-con-problemas.txt
