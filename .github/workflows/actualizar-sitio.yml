# Actualiza catalogo.json, las páginas de cada película y el sitemap con lo publicado en Firestore.
# Corre solo cada 15 minutos y también a mano: pestaña "Actions" → "Actualizar sitio" → "Run workflow".
name: Actualizar sitio
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-sitio
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
        env:
          # Opcional: clave de TMDB para la sección "Próximas" (Settings → Secrets and variables → Actions)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Guardar cambios
        run: |
          git config user.name "pelipe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Actualizar catálogo y páginas"; git push; fi
